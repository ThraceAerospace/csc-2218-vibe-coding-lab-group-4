<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Ocean Map - Zoom Sailing</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;background:#0f1e2a;font-family:'IM Fell English';overflow:hidden;display:flex;flex-direction:column}
.top-bar{background:#2b1c0e;color:#e8d9b0;display:flex;justify-content:space-between;padding:12px 16px;font-family:'Cinzel';border-bottom:4px solid #c9a44a}
.bbtn{padding:10px 18px;border:1px solid #c9a44a;color:#f5d77a;background:#3d2a15;cursor:pointer;font-family:'Cinzel';font-size:11px}
.bbtn.gold{background:#c9a44a;color:#2b1c0e;font-weight:700}
.map-wrap{flex:1;background:#2b1c0e;padding:10px;display:flex;overflow:hidden}
.map-box{flex:1;border:4px solid #c9a44a;position:relative;background:#0f1e2a;display:flex;align-items:center;justify-content:center;overflow:hidden}
.map-image{width:100%;height:100%;background-image:url('ocean.jpg');background-size:contain;background-repeat:no-repeat;background-position:center;position:relative;transition:transform 2s ease-in-out, background-size 2s ease-in-out;transform-origin:center center}
.map-image.zoomed{transform:scale(1.8);background-size:cover}
.port{position:absolute;padding:6px 12px;background:#fdf6dc;border:2px solid #2b1c0e;font-family:'Cinzel';font-size:11px;transform:translate(-50%,-50%);transition:all 0.3s}
.ship{position:absolute;font-size:38px;z-index:20;transition:left 2s ease-in-out, top 2s ease-in-out, transform 0.5s;transform:translate(-50%,-50%);filter:drop-shadow(0 0 8px gold)}
.bottom{height:70px;background:#2b1c0e;display:flex;align-items:center;justify-content:center;gap:12px;border-top:3px solid #c9a44a}
.zoom-info{position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.7);color:#f5d77a;padding:5px 10px;font-size:10px;font-family:'Cinzel';z-index:30;border-radius:5px}
</style></head><body>
<div class="top-bar"><h1 style="color:#f5d77a;font-size:12px">MAPA DA ROTA • ZOOM MODE • <span id="pct">0%</span></h1><div><span id="status">In LISBOA - Ready to Zoom</span></div></div>
<div class="map-wrap"><div class="map-box"><div class="map-image" id="mapImg">
<div class="zoom-info" id="zoomInfo">🔍 ZOOM: 1x</div>
<div class="port" style="left:18%;top:32%">LISBOA</div>
<div class="port" style="left:32%;top:84%">CAPE</div>
<div class="port" style="left:78%;top:38%;background:#d4a017">GOA</div>
<div class="port" style="left:88%;top:52%;opacity:0.5">MALACCA (LOCKED)</div>
<div class="ship" id="ship" style="left:19%;top:34%">⛵</div>
</div></div></div>
<div class="bottom">
<button class="bbtn gold" id="sailBtn" onclick="sail()">🔍⛵ SET SAIL WITH ZOOM →</button>
<button class="bbtn" onclick="location.href='feitoria.html'">SKIP TO GOA</button>
</div>

<script>
let step=0;
const route=[
{left:'19%',top:'34%',pct:'0%',status:'In LISBOA',zoom:1,origin:'18% 32%'},
{left:'28%',top:'58%',pct:'25%',status:'Zooming Atlantic - Kraken! 🐙',zoom:1.8,origin:'28% 58%'},
{left:'50%',top:'86%',pct:'50%',status:'ZOOM x2 - Cape Storms ⛈️',zoom:2.2,origin:'50% 86%'},
{left:'65%',top:'60%',pct:'75%',status:'ZOOM x1.8 - Sea Serpent 🐍',zoom:1.8,origin:'65% 60%'},
{left:'77%',top:'40%',pct:'100%',status:'Arrived GOA! Zoom out',zoom:1,origin:'77% 40%'}
];
function sail(){
 if(step>=route.length-1){location.href='feitoria.html';return;}
 step++;
 const p=route[step];
 const ship=document.getElementById('ship');
 const map=document.getElementById('mapImg');
 ship.style.left=p.left;
 ship.style.top=p.top;
 map.style.transform=`scale(${p.zoom})`;
 map.style.transformOrigin=p.origin;
 document.getElementById('pct').textContent=p.pct;
 document.getElementById('status').textContent=p.status;
 document.getElementById('zoomInfo').textContent=`🔍 ZOOM: ${p.zoom}x`;
 document.getElementById('sailBtn').textContent=p.pct=='100%'?'ARRIVED! → FEITORIA':'ZOOM '+p.zoom+'x - '+p.pct+' CONTINUE';
 // Shake effect on storm
 if(p.pct=='50%'){ship.style.transform='translate(-50%,-50%) rotate(-10deg)';setTimeout(()=>ship.style.transform='translate(-50%,-50%) rotate(10deg)',200);setTimeout(()=>ship.style.transform='translate(-50%,-50%)',400);}
 if(p.pct=='100%'){setTimeout(()=>{location.href='feitoria.html';},1500);}
}
</script>
</body></html>
