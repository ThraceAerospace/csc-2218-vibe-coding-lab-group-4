<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Feitoria - Fixed Top</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=IM+Fell+English&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;background:#0f1e2a;font-family:'IM Fell English';overflow:hidden;display:flex;flex-direction:column}
.top-bar{background:#2b1c0e;color:#e8d9b0;display:flex;justify-content:space-between;padding:12px 16px;font-family:'Cinzel';border-bottom:4px solid #c9a44a}
.bbtn{padding:10px 18px;border:1px solid #c9a44a;color:#f5d77a;background:#3d2a15;cursor:pointer;font-family:'Cinzel';font-size:11px}
.bbtn.gold{background:#c9a44a;color:#2b1c0e;font-weight:700}.dark{background:#3d2a15;color:#f5d77a}
.map-wrap{flex:1;background:#1a1208;padding:10px;display:flex}
.map-box{flex:1;border:4px solid #c9a44a;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.bg-image{width:100%;height:100%;background-image:url('feitoria.jpg');background-size:contain;background-repeat:no-repeat;background-position:center top;position:relative;display:flex;align-items:center;justify-content:center}
.card{background:rgba(253,246,220,0.92);border:4px solid #3b2314;padding:22px;max-width:480px;width:88%;text-align:center;box-shadow:0 0 20px rgba(0,0,0,0.6)}
h2{font-family:'Cinzel';color:#8b1a1a}
.price{border:2px dashed #8c6a3a;padding:10px;margin:12px 0;background:white;font-size:13px}
.bottom{height:70px;background:#2b1c0e;display:flex;align-items:center;justify-content:center;gap:12px;border-top:3px solid #c9a44a}
</style></head><body>
<div class="top-bar"><h1 style="color:#f5d77a;font-size:14px">⚖️ FEITORIA • GOA 1510 • FEITORIA.JPG - FULL VIEW</h1><div><button class="bbtn dark" onclick="location.href='index.html'">← OCEAN MAP</button></div></div>
<div class="map-wrap"><div class="map-box"><div class="bg-image">
<div class="card">
<h2>Goa Feitoria Trading Post</h2>
<p style="margin-top:6px;font-size:13px">Now top is NOT cut! You can see Cinnamon, Cloves, Cardamom prices.</p>
<div class="price"><b>Black Pepper</b><br>Buy: 12 Gold in Goa | Sell: 22 Gold in Lisbon<br><br><b>Your Cargo: 50 crates</b><br>Bottom Trust Meter now visible too!</div>
<button class="bbtn gold" style="width:100%;padding:12px" onclick="location.href='cargo.html'">MANAGE CARGO → cargo.jpg</button>
</div>
</div></div></div>
<div class="bottom"><button class="bbtn gold" onclick="location.href='cargo.html'">MANAGE CARGO →</button><button class="bbtn" onclick="location.href='index.html'">BACK TO OCEAN</button></div>
</body></html>
